<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMDTECH  | Phone Sales • Flashing • Repairs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0a;
    color: #fff;
    min-height: 100vh;
    padding: 20px;
  }
  header {
    text-align: center;
    padding: 30px 0;
    border-bottom: 1px solid #222;
    margin-bottom: 30px;
  }
  h1 {
    font-size: 2.5rem;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #00ff88, #00d4ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .tagline {
    color: #888;
    margin-top: 10px;
    font-size: 0.95rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .product {
    background: #141414;
    border: 1px solid #222;
    border-radius: 16px;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s;
  }
  .product:hover {
    transform: translateY(-4px);
    border-color: #00ff88;
  }
  .product img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    background: #1a1a1a;
  }
  .product-info {
    padding: 18px;
  }
  .product h3 {
    font-size: 1.1rem;
    margin-bottom: 8px;
    color: #fff;
  }
  .price {
    color: #00ff88;
    font-weight: 700;
    font-size: 1.2rem;
    margin-bottom: 14px;
  }
  .order-btn {
    display: block;
    width: 100%;
    padding: 12px;
    background: #25D366;
    color: #fff;
    text-decoration: none;
    text-align: center;
    border-radius: 10px;
    font-weight: 700;
    transition: background 0.2s;
  }
  .order-btn:hover {
    background: #1ebe57;
  }
  footer {
    text-align: center;
    padding: 40px 0 20px;
    color: #555;
    font-size: 0.85rem;
    margin-top: 40px;
    border-top: 1px solid #222;
  }
  .contact {
    display: inline-block;
    margin-top: 10px;
    color: #00ff88;
    text-decoration: none;
  }
</style>
</head>
<body>

<header>
  <h1>KMDTECH </h1>
  <p class="tagline">📱 Phone Sales • ⚡ Flashing • 🔧 Repairs</p>
</header>

<div class="grid">

  <!-- ===== PRODUCT 1 ===== -->
  <div class="product">
    <img src="https://via.placeholder.com/400x220/1a1a1a/00ff88?text=iPhone+11" alt="iPhone 11">
    <div class="product-info">
      <h3>iPhone 11 (Clean)</h3>
      <p class="price">₦250,000</p>
      <a class="order-btn" href="https://wa.me/2347057558443?text=Hi%2C%20I%20want%20to%20order%20the%20iPhone%2011" target="_blank">Order on WhatsApp</a>
    </div>
  </div>

  <!-- ===== PRODUCT 2 ===== -->
  <div class="product">
    <img src="https://via.placeholder.com/400x220/1a1a1a/00ff88?text=Screen+Repair" alt="Screen Repair">
    <div class="product-info">
      <h3>Screen Replacement</h3>
      <p class="price">₦15,000</p>
      <a class="order-btn" href="https://wa.me/2347057558443?text=Hi%2C%20I%20want%20to%20book%20a%20Screen%20Replacement" target="_blank">Book on WhatsApp</a>
    </div>
  </div>

  <!-- ===== PRODUCT 3 ===== -->
  <div class="product">
    <img src="https://via.placeholder.com/400x220/1a1a1a/00ff88?text=Flashing" alt="Flashing">
    <div class="product-info">
      <h3>Software Flashing</h3>
      <p class="price">₦5,000</p>
      <a class="order-btn" href="https://wa.me/2347057558443?text=Hi%2C%20I%20want%20Flashing%20Service" target="_blank">Book on WhatsApp</a>
    </div>
  </div>

  <!-- ===== ADD MORE PRODUCTS HERE ===== -->

</div>

<footer>
  © 2025 KMDTECH  — All rights reserved<br>
  <a class="contact" href="https://wa.me/2347057558443">💬 Chat with us on WhatsApp</a>
</footer>

</body>
</html>
